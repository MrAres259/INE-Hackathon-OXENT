<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Atalaya Electoral — Map Print</title>
  <link rel="stylesheet" href="/maplibre-gl.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #map {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="/maplibre-gl.js"></script>
  <script src="/print.js"></script>
</body>
</html>
